<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1670" viewBox="0 0 1600 1670" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order-placement flow</title>
  <desc id="desc">Architecture diagram showing the browser UI, Express server, four API routers, configuration, ten library modules, the JSON data file, and the twelve-step order-placement flow.</desc>

  <defs>
    <linearGradient id="headerGradient" x1="0" x2="1">
      <stop offset="0" stop-color="#052e2b"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="flowGradient" x1="0" x2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#f0fdfa"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowData" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <style>
      .canvas { fill: #f8fafc; }
      .header-title { font: 700 36px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
      .header-sub { font: 400 17px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #a7f3d0; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 16; }
      .panel-green { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.5; rx: 16; }
      .panel-blue { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; rx: 16; }
      .panel-amber { fill: #fffbeb; stroke: #fcd34d; stroke-width: 1.5; rx: 16; }
      .layer-label { font: 700 15px system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 1.4px; fill: #047857; }
      .card { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; rx: 12; filter: url(#shadow); }
      .card-green { fill: #ffffff; stroke: #10b981; stroke-width: 1.8; rx: 12; filter: url(#shadow); }
      .card-blue { fill: #ffffff; stroke: #3b82f6; stroke-width: 1.5; rx: 12; filter: url(#shadow); }
      .card-amber { fill: #ffffff; stroke: #f59e0b; stroke-width: 1.8; rx: 12; filter: url(#shadow); }
      .card-title { font: 700 18px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #0f172a; }
      .card-title-green { font: 700 18px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #047857; }
      .card-body { font: 400 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .card-small { font: 400 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #64748b; }
      .connection { fill: none; stroke: #0f766e; stroke-width: 3; marker-end: url(#arrow); }
      .connection-muted { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrowMuted); }
      .connection-data { fill: none; stroke: #b45309; stroke-width: 3; marker-end: url(#arrowData); }
      .edge-label { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f766e; }
      .flow-panel { fill: url(#flowGradient); stroke: #6ee7b7; stroke-width: 2; rx: 18; }
      .flow-step { fill: #ffffff; stroke: #10b981; stroke-width: 1.5; rx: 10; filter: url(#shadow); }
      .flow-number { fill: #059669; }
      .flow-number-text { font: 700 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .flow-title { font: 700 14px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #064e3b; text-anchor: middle; }
      .flow-sub { font: 400 11.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; text-anchor: middle; }
      .legend { font: 500 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect class="canvas" width="1600" height="1670"/>
  <rect width="1600" height="90" fill="url(#headerGradient)"/>
  <text id="titleText" class="header-title" x="48" y="45">ShopLedger architecture</text>
  <text class="header-sub" x="48" y="72">Legacy POS, inventory, Khata ledger, invoicing, and GST reconciliation</text>

  <!-- UI layer -->
  <rect class="panel-green" x="40" y="115" width="1520" height="145"/>
  <text class="layer-label" x="64" y="143">BROWSER UI · public/</text>

  <rect class="card-green" x="75" y="162" width="405" height="72"/>
  <text class="card-title-green" x="96" y="190">public/index.html</text>
  <text class="card-body" x="96" y="216">POS · Order History · Customer Khata · GST Audit</text>

  <rect class="card-green" x="598" y="162" width="405" height="72"/>
  <text class="card-title-green" x="619" y="190">public/js/app.js</text>
  <text class="card-body" x="619" y="216">API calls · DOM rendering · user actions</text>

  <rect class="card-green" x="1120" y="162" width="405" height="72"/>
  <text class="card-title-green" x="1141" y="190">public/css/style.css</text>
  <text class="card-body" x="1141" y="216">Application presentation and responsive layout</text>

  <!-- Server layer -->
  <rect class="panel-blue" x="40" y="295" width="1520" height="135"/>
  <text class="layer-label" x="64" y="323">APPLICATION ENTRY AND CONFIGURATION</text>

  <rect class="card-amber" x="105" y="340" width="350" height="66"/>
  <text class="card-title" x="126" y="367">config.js</text>
  <text class="card-body" x="126" y="390">Port · shop · GST slabs · coupons · admin key</text>

  <rect class="card-blue" x="570" y="330" width="460" height="86"/>
  <text class="card-title" x="591" y="361">server.js</text>
  <text class="card-body" x="591" y="384">Express app · JSON parsing · static UI · router mounting</text>
  <text class="card-small" x="591" y="404">GET /orders/:id/invoice → lib/invoice.js</text>

  <rect class="card" x="1145" y="340" width="350" height="66"/>
  <text class="card-title" x="1166" y="367">package.json</text>
  <text class="card-body" x="1166" y="390">Start command · Express and body-parser</text>

  <!-- UI to server -->
  <path class="connection" d="M 800 234 L 800 329"/>
  <text class="edge-label" x="815" y="282">HTTP + JSON</text>

  <!-- Routes layer -->
  <rect class="panel" x="40" y="470" width="1520" height="190"/>
  <text class="layer-label" x="64" y="498">EXPRESS ROUTERS · mounted under /api</text>

  <rect class="card" x="70" y="520" width="345" height="110"/>
  <text class="card-title" x="90" y="550">routes/products.js</text>
  <text class="card-body" x="90" y="577">GET /products · GET /coupons</text>
  <text class="card-small" x="90" y="604">store · inventory · tax · coupons</text>

  <rect class="card-green" x="442" y="520" width="345" height="110"/>
  <text class="card-title-green" x="462" y="550">routes/orders.js</text>
  <text class="card-body" x="462" y="577">List · get · create · cancel orders</text>
  <text class="card-small" x="462" y="604">store · inventory · pricing · coupons · orders · ledger</text>

  <rect class="card" x="814" y="520" width="345" height="110"/>
  <text class="card-title" x="834" y="550">routes/customers.js</text>
  <text class="card-body" x="834" y="577">GET /customers · POST /:id/settle</text>
  <text class="card-small" x="834" y="604">store · ledger</text>

  <rect class="card" x="1186" y="520" width="345" height="110"/>
  <text class="card-title" x="1206" y="550">routes/reports.js</text>
  <text class="card-body" x="1206" y="577">Dashboard · GST · preview · admin export</text>
  <text class="card-small" x="1206" y="604">config · store · reports · pricing · coupons</text>

  <!-- Server to routers -->
  <path class="connection" d="M 800 416 L 800 448 L 242 448 L 242 519"/>
  <path class="connection" d="M 800 448 L 615 448 L 615 519"/>
  <path class="connection" d="M 800 448 L 987 448 L 987 519"/>
  <path class="connection" d="M 800 448 L 1359 448 L 1359 519"/>

  <!-- Library layer -->
  <rect class="panel" x="40" y="700" width="1520" height="350"/>
  <text class="layer-label" x="64" y="728">BUSINESS AND PERSISTENCE MODULES · lib/</text>

  <!-- Row one -->
  <rect class="card" x="70" y="755" width="260" height="105"/>
  <text class="card-title" x="90" y="785">inventory.js</text>
  <text class="card-body" x="90" y="811">Sellable stock checks</text>
  <text class="card-small" x="90" y="836">reserve · release · summarize</text>

  <rect class="card-green" x="370" y="755" width="260" height="105"/>
  <text class="card-title-green" x="390" y="785">orders.js</text>
  <text class="card-body" x="390" y="811">Order records and queries</text>
  <text class="card-small" x="390" y="836">add · get · cancel · list</text>

  <rect class="card" x="670" y="755" width="260" height="105"/>
  <text class="card-title" x="690" y="785">ledger.js</text>
  <text class="card-body" x="690" y="811">Khata accounts</text>
  <text class="card-small" x="690" y="836">charge · reverse · settle</text>

  <rect class="card-green" x="970" y="755" width="260" height="105"/>
  <text class="card-title-green" x="990" y="785">pricing.js</text>
  <text class="card-body" x="990" y="811">Checkout totals</text>
  <text class="card-small" x="990" y="836">subtotal · discount · tax</text>

  <rect class="card" x="1270" y="755" width="260" height="105"/>
  <text class="card-title" x="1290" y="785">reports.js</text>
  <text class="card-body" x="1290" y="811">Dashboard and GST audit</text>
  <text class="card-small" x="1290" y="836">summary · reconciliation</text>

  <!-- Row two -->
  <rect class="card" x="70" y="900" width="260" height="105"/>
  <text class="card-title" x="90" y="930">dates.js</text>
  <text class="card-body" x="90" y="956">Indian date helpers</text>
  <text class="card-small" x="90" y="981">today · normalize · fiscal year</text>

  <rect class="card-green" x="370" y="900" width="260" height="105"/>
  <text class="card-title-green" x="390" y="930">coupons.js</text>
  <text class="card-body" x="390" y="956">Coupon rules and caps</text>
  <text class="card-small" x="390" y="981">normalize · validate · discount</text>

  <rect class="card-green" x="670" y="900" width="260" height="105"/>
  <text class="card-title-green" x="690" y="930">tax.js</text>
  <text class="card-body" x="690" y="956">HSN GST slab resolution</text>
  <text class="card-small" x="690" y="981">rate · CGST/SGST split</text>

  <rect class="card" x="970" y="900" width="260" height="105"/>
  <text class="card-title" x="990" y="930">invoice.js</text>
  <text class="card-body" x="990" y="956">Invoice figures and HTML</text>
  <text class="card-small" x="990" y="981">compute · render</text>

  <rect class="card-amber" x="1270" y="900" width="260" height="105"/>
  <text class="card-title" x="1290" y="930">store.js</text>
  <text class="card-body" x="1290" y="956">JSON persistence</text>
  <text class="card-small" x="1290" y="981">read · write · audit</text>

  <!-- Router group to libraries -->
  <path class="connection-muted" d="M 800 660 L 800 683 L 500 683 L 500 754"/>
  <path class="connection-muted" d="M 800 683 L 1100 683 L 1100 754"/>
  <text class="legend" x="818" y="690">calls domain modules</text>

  <!-- Key library dependencies -->
  <path class="connection-muted" d="M 1100 860 L 1100 880 L 800 880 L 800 899"/>
  <path class="connection-muted" d="M 1100 880 L 500 880 L 500 899"/>
  <path class="connection-muted" d="M 500 860 L 500 875 L 200 875 L 200 899"/>
  <path class="connection-muted" d="M 800 860 L 800 875 L 200 875"/>

  <!-- Data layer -->
  <rect class="panel-amber" x="40" y="1090" width="1520" height="115"/>
  <text class="layer-label" x="64" y="1118">TRACKED JSON DATA</text>
  <rect class="card-amber" x="575" y="1126" width="450" height="58"/>
  <text class="card-title" x="596" y="1152">data/db.json</text>
  <text class="card-body" x="596" y="1174">Products · orders · customers · settlements · audit log</text>

  <path class="connection-data" d="M 1400 1005 L 1400 1070 L 800 1070 L 800 1125"/>
  <text class="legend" x="1120" y="1061">store.js reads and rewrites the complete file</text>

  <!-- Config dependencies -->
  <path class="connection-muted" d="M 280 406 L 280 440 L 35 440 L 35 875 L 60 875"/>
  <text class="legend" x="48" y="889">config used by server, routes, inventory, coupons, tax, and invoice</text>

  <!-- Order flow -->
  <rect class="flow-panel" x="40" y="1240" width="1520" height="380"/>
  <text class="layer-label" x="64" y="1272">ORDER PLACEMENT FLOW · POST /api/orders</text>

  <!-- Flow row one -->
  <g>
    <rect class="flow-step" x="65" y="1300" width="220" height="105"/>
    <circle class="flow-number" cx="87" cy="1322" r="15"/>
    <text class="flow-number-text" x="87" y="1322">1</text>
    <text class="flow-title" x="175" y="1350">public/js/app.js</text>
    <text class="flow-sub" x="175" y="1375">Collect cart and customer</text>
    <text class="flow-sub" x="175" y="1392">details from the UI</text>
  </g>

  <g>
    <rect class="flow-step" x="315" y="1300" width="220" height="105"/>
    <circle class="flow-number" cx="337" cy="1322" r="15"/>
    <text class="flow-number-text" x="337" y="1322">2</text>
    <text class="flow-title" x="425" y="1350">POST /api/orders</text>
    <text class="flow-sub" x="425" y="1375">Send IDs, quantities,</text>
    <text class="flow-sub" x="425" y="1392">coupon, and payment mode</text>
  </g>

  <g>
    <rect class="flow-step" x="565" y="1300" width="220" height="105"/>
    <circle class="flow-number" cx="587" cy="1322" r="15"/>
    <text class="flow-number-text" x="587" y="1322">3</text>
    <text class="flow-title" x="675" y="1350">routes/orders.js</text>
    <text class="flow-sub" x="675" y="1375">Validate request and</text>
    <text class="flow-sub" x="675" y="1392">resolve product records</text>
  </g>

  <g>
    <rect class="flow-step" x="815" y="1300" width="220" height="105"/>
    <circle class="flow-number" cx="837" cy="1322" r="15"/>
    <text class="flow-number-text" x="837" y="1322">4</text>
    <text class="flow-title" x="925" y="1350">store.read()</text>
    <text class="flow-sub" x="925" y="1375">Load and parse</text>
    <text class="flow-sub" x="925" y="1392">data/db.json</text>
  </g>

  <g>
    <rect class="flow-step" x="1065" y="1300" width="220" height="105"/>
    <circle class="flow-number" cx="1087" cy="1322" r="15"/>
    <text class="flow-number-text" x="1087" y="1322">5</text>
    <text class="flow-title" x="1175" y="1350">inventory.check()</text>
    <text class="flow-sub" x="1175" y="1375">Verify each requested</text>
    <text class="flow-sub" x="1175" y="1392">sellable quantity</text>
  </g>

  <g>
    <rect class="flow-step" x="1315" y="1300" width="220" height="105"/>
    <circle class="flow-number" cx="1337" cy="1322" r="15"/>
    <text class="flow-number-text" x="1337" y="1322">6</text>
    <text class="flow-title" x="1425" y="1350">coupons.validate()</text>
    <text class="flow-sub" x="1425" y="1375">Normalize and check</text>
    <text class="flow-sub" x="1425" y="1392">the coupon rules</text>
  </g>

  <path class="connection" d="M 285 1353 L 314 1353"/>
  <path class="connection" d="M 535 1353 L 564 1353"/>
  <path class="connection" d="M 785 1353 L 814 1353"/>
  <path class="connection" d="M 1035 1353 L 1064 1353"/>
  <path class="connection" d="M 1285 1353 L 1314 1353"/>

  <!-- Flow row two -->
  <g>
    <rect class="flow-step" x="65" y="1470" width="220" height="105"/>
    <circle class="flow-number" cx="87" cy="1492" r="15"/>
    <text class="flow-number-text" x="87" y="1492">7</text>
    <text class="flow-title" x="175" y="1520">pricing.computeTotals()</text>
    <text class="flow-sub" x="175" y="1545">Discount, HSN GST,</text>
    <text class="flow-sub" x="175" y="1562">and ledger total</text>
  </g>

  <g>
    <rect class="flow-step" x="315" y="1470" width="220" height="105"/>
    <circle class="flow-number" cx="337" cy="1492" r="15"/>
    <text class="flow-number-text" x="337" y="1492">8</text>
    <text class="flow-title" x="425" y="1520">ledger.chargeOrderToKhata()</text>
    <text class="flow-sub" x="425" y="1545">Optional: check limit</text>
    <text class="flow-sub" x="425" y="1562">and debit customer</text>
  </g>

  <g>
    <rect class="flow-step" x="565" y="1470" width="220" height="105"/>
    <circle class="flow-number" cx="587" cy="1492" r="15"/>
    <text class="flow-number-text" x="587" y="1492">9</text>
    <text class="flow-title" x="675" y="1520">inventory.reserve()</text>
    <text class="flow-sub" x="675" y="1545">Deduct quantities from</text>
    <text class="flow-sub" x="675" y="1562">physical product stock</text>
  </g>

  <g>
    <rect class="flow-step" x="815" y="1470" width="220" height="105"/>
    <circle class="flow-number" cx="837" cy="1492" r="15"/>
    <text class="flow-number-text" x="837" y="1492">10</text>
    <text class="flow-title" x="925" y="1520">orders.add()</text>
    <text class="flow-sub" x="925" y="1545">Allocate ID and append</text>
    <text class="flow-sub" x="925" y="1562">the order record</text>
  </g>

  <g>
    <rect class="flow-step" x="1065" y="1470" width="220" height="105"/>
    <circle class="flow-number" cx="1087" cy="1492" r="15"/>
    <text class="flow-number-text" x="1087" y="1492">11</text>
    <text class="flow-title" x="1175" y="1520">store.write()</text>
    <text class="flow-sub" x="1175" y="1545">Append audit and rewrite</text>
    <text class="flow-sub" x="1175" y="1562">data/db.json</text>
  </g>

  <g>
    <rect class="flow-step" x="1315" y="1470" width="220" height="105"/>
    <circle class="flow-number" cx="1337" cy="1492" r="15"/>
    <text class="flow-number-text" x="1337" y="1492">12</text>
    <text class="flow-title" x="1425" y="1520">HTTP 201 response</text>
    <text class="flow-sub" x="1425" y="1545">Return order and refresh</text>
    <text class="flow-sub" x="1425" y="1562">UI data and totals</text>
  </g>

  <path class="connection" d="M 285 1523 L 314 1523"/>
  <path class="connection" d="M 535 1523 L 564 1523"/>
  <path class="connection" d="M 785 1523 L 814 1523"/>
  <path class="connection" d="M 1035 1523 L 1064 1523"/>
  <path class="connection" d="M 1285 1523 L 1314 1523"/>

  <!-- Row transition -->
  <path class="connection" d="M 1535 1353 L 1547 1353 L 1547 1435 L 53 1435 L 53 1523 L 64 1523"/>

  <!-- Legend -->
  <line x1="65" y1="1597" x2="105" y2="1597" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="legend" x="116" y="1602">Request / order flow</text>
  <line x1="300" y1="1597" x2="340" y2="1597" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowMuted)"/>
  <text class="legend" x="351" y="1602">Module dependency</text>
  <line x1="555" y1="1597" x2="595" y2="1597" stroke="#b45309" stroke-width="3" marker-end="url(#arrowData)"/>
  <text class="legend" x="606" y="1602">File persistence</text>
  <text class="legend" x="1525" y="1602" text-anchor="end">All labels correspond to tracked repository components.</text>
</svg>
